name: Windows presentation regression
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish -c Release -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true -o publish -p:DebugType=None -p:DebugSymbols=false
      - shell: pwsh
        run: ./tests/windows-renderers.ps1 -Quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-presentation
          path: desktop/test-results/renderers/
