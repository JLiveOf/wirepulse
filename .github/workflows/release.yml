name: Build and publish all platforms
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      number: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          python3 scripts/version.py --check
          python3 scripts/check-parity.py
          python3 scripts/check-localization.py
          version=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag and VERSION disagree" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            framework: net10.0-windows10.0.19041.0
            rid: win-x64
          - os: ubuntu-24.04
            framework: net10.0
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet publish -c Release -f ${{ matrix.framework }} -r ${{ matrix.rid }} --self-contained true -o publish -p:DebugType=None -p:DebugSymbols=false
        if: runner.os != 'Windows'
      - name: Windows renderer, native WinUI settings and video cadence
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-windows.ps1 -Test
      - name: Native WinUI welcome and update windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item test-results -ItemType Directory -Force | Out-Null
          $p=Start-Process ./publish/WirePulse.exe -ArgumentList '--experience-self-test' -Wait -PassThru -RedirectStandardOutput test-results/experience.log -RedirectStandardError test-results/experience.err
          if($p.ExitCode -ne 0){Get-Content test-results/experience.err;throw 'Native experience test failed'}
          if(!(Select-String -Path test-results/experience.log -Pattern 'PASS WinUI' -Quiet)){throw 'Native experience test did not complete'}
      - name: DSP and Cider protocol
        shell: bash
        run: ./publish/WirePulse${{ matrix.rid == 'win-x64' && '.exe' || '' }} --self-test
      - name: Portable cross-platform layout package
        shell: bash
        run: ./publish/WirePulse${{ matrix.rid == 'win-x64' && '.exe' || '' }} --layout-self-test tests/fixtures/portable-layout.wirepulse --layout-output layout-roundtrip.wirepulse
      - uses: actions/upload-artifact@v4
        with:
          name: layout-roundtrip-${{ matrix.rid }}
          path: desktop/layout-roundtrip.wirepulse
      - name: English and Spanish localization
        run: ./publish/WirePulse${{ matrix.rid == 'win-x64' && '.exe' || '' }} --localization-self-test
      - name: Text effects, gradients and updater policies
        run: dotnet run --project tests/Effects -c Release
      - name: English settings and editor
        run: dotnet run --project tests/UiTests -c Release -- --english
      - name: Settings and independent display editing
        run: dotnet run --project tests/UiTests -c Release
      - name: Optimized orb pixel equivalence
        run: dotnet run --project tests/OrbRendering -c Release
      - name: GIF delta-frame equivalence and decode performance
        run: dotnet run --project tests/GifPerformance -c Release
      - name: Direct3D and Direct2D native render targets
        if: runner.os == 'Windows'
        run: ./publish/WirePulse.exe --native-draw-self-test
      - name: Native HTML widget and audio event (Windows)
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: ./publish/WirePulse.exe --widget-smoke-test tests/fixtures/widget.html --widget-output widget.png
      - name: CPU renderer benchmarks, stereo equivalence and allocations
        run: dotnet run --project tests/Performance -c Release -- test-results/performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ matrix.rid }}
          path: desktop/test-results/performance*
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg cinnamon nemo pulseaudio pulseaudio-utils playerctl xvfb xdotool imagemagick python3-dbus python3-gi python3-pil libxfixes3 libice6 libsm6 libfontconfig1 libwebkit2gtk-4.1-0
      - name: Native glass welcome and X11 blurred backdrop
        if: runner.os == 'Linux'
        run: xvfb-run -a ./publish/WirePulse --welcome-smoke-test
      - name: Native HTML widget and audio event (Linux)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a ./publish/WirePulse --widget-smoke-test tests/fixtures/widget.html --widget-output widget.png
      - name: Cinnamon, output capture and MPRIS
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash tests/linux-integration.sh
      - name: Native Windows graphics modes and safe fallbacks
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tests/windows-renderers.ps1
          ./tests/windows-displays.ps1
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-renderers
          path: |
            desktop/test-results/renderers/
            desktop/test-results/*.log
            desktop/test-results/*.err
            desktop/test-results/editor-*.json
            desktop/test-results/editor-*.txt
            desktop/test-results/editor-*.png
            desktop/test-results/winui-native.json
            desktop/test-results/video-*.json
            desktop/test-results/audio-loopback.json
            desktop/test-results/windows-displays.json
      - name: Package application
        shell: bash
        run: |
          python packaging/package.py ${{ matrix.rid }} ${{ needs.version.outputs.number }}
          rm packages/SHA256SUMS.txt
      - name: Install, reinstall, self-test and uninstall Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/test-installer.ps1 -Installer packages/WirePulse-${{ needs.version.outputs.number }}-win-x64-Setup.exe -Version ${{ needs.version.outputs.number }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: desktop/packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: linux-integration-results
          path: desktop/test-results/
  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build native Apple silicon app
        run: |
          test "$(uname -m)" = arm64
          ./macos/build.sh
      - name: FFT, Cider, display profiles and relocation
        run: |
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --effects-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --localization-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --layout-self-test desktop/tests/fixtures/portable-layout.wirepulse --layout-output layout-roundtrip-macos.wirepulse
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --media-self-test desktop/tests/fixtures/background.mp4
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --widget-self-test desktop/tests/fixtures/widget.html
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --editor-self-test --gif-fixture desktop/tests/fixtures/disposal.gif
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --orb-render-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --scene-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --welcome-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --startup-self-test
          macos/dist/WirePulse.app/Contents/MacOS/WirePulse --display-profile-test
          python3 macos/scripts/test-cider.py macos/dist/WirePulse.app/Contents/MacOS/WirePulse
          python3 macos/scripts/test-relocation.py macos/dist/WirePulse.app
          codesign --verify --deep --strict macos/dist/WirePulse.app
      - name: Package application
        run: |
          mkdir -p packages
          ditto -c -k --sequesterRsrc --keepParent macos/dist/WirePulse.app packages/WirePulse-${{ needs.version.outputs.number }}-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-macOS-arm64
          path: packages/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: layout-roundtrip-macos
          path: layout-roundtrip-macos.wirepulse
  layout-compatibility:
    needs: [desktop, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: layout-roundtrip-*
          path: layouts
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-x64
          path: linux-package
      - name: Import Windows, Linux and Swift exports with the common Linux reader
        run: |
          mkdir -p layout-player checked
          tar -xzf linux-package/*.tar.gz -C layout-player
          for layout in layouts/*/*.wirepulse; do
            layout-player/*/WirePulse --layout-self-test "$layout" --layout-output "checked/$(basename "$(dirname "$layout")").wirepulse"
          done
  release:
    needs: [version, desktop, macos, layout-compatibility]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: packages
      - name: Verify complete download set and create checksums
        run: python3 scripts/check-release.py packages
      - name: Add the editor video demo
        run: |
          cp docs/media/editor-demo.mp4 packages/editor-demo.mp4
          cd packages
          sha256sum editor-demo.mp4 >> SHA256SUMS.txt
      - name: Publish one release with every platform
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.number }}
        shell: bash
        run: |
          if gh release view "v$VERSION" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "This version is already published; create a new version instead"'
            gh release upload "v$VERSION" packages/* --clobber
          else
            gh release create "v$VERSION" packages/* --draft --verify-tag --title "WirePulse $VERSION · Yamato" --notes-file RELEASE.md
          fi
          gh release edit "v$VERSION" --draft=false --latest
